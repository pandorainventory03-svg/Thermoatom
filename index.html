<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff6b35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Fisikaku - QR & AR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
    </script>
    <style>
        /* ============================================================
                   SPLASH SCREEN — TEMA FISIKAKU
                   ============================================================ */
        #splashscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            z-index: 9999;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.7s ease, transform 0.7s ease;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        #splashscreen.splash-hidden {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        /* Latar belakang dengan ornamen */
        #splashscreen::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -30%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle at 70% 30%, rgba(255, 107, 53, 0.06), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        #splashscreen::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle at 30% 70%, rgba(245, 87, 108, 0.05), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Dekorasi partikel latar */
        .splash-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 107, 53, 0.08);
            pointer-events: none;
            animation: particleFloat 8s ease-in-out infinite alternate;
        }
        .splash-particle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 8%;
            left: 5%;
            animation-delay: 0s;
        }
        .splash-particle:nth-child(2) {
            width: 120px;
            height: 120px;
            bottom: 12%;
            right: 3%;
            animation-delay: 2s;
            background: rgba(0, 180, 216, 0.05);
        }
        .splash-particle:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 55%;
            left: 2%;
            animation-delay: 4s;
            background: rgba(245, 87, 108, 0.06);
        }
        .splash-particle:nth-child(4) {
            width: 100px;
            height: 100px;
            bottom: 30%;
            right: 8%;
            animation-delay: 1s;
            background: rgba(255, 107, 53, 0.04);
        }

        @keyframes particleFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -25px) scale(1.1);
            }
        }

        /* Logo animasi */
        .splash-logo-wrap {
            position: relative;
            z-index: 2;
            margin-bottom: 18px;
        }

        .splash-logo {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, #ff6b35 0%, #f5576c 100%);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 48px rgba(255, 107, 53, 0.30);
            animation: logoPulse 2.2s ease-in-out infinite;
            position: relative;
        }

        .splash-logo::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.15), rgba(245, 87, 108, 0.10));
            z-index: -1;
            animation: logoGlow 2.2s ease-in-out infinite alternate;
        }

        @keyframes logoPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }

        @keyframes logoGlow {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.12);
                opacity: 1;
            }
        }

        .splash-logo i {
            font-size: 46px;
            color: #fff;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.10));
        }

        /* Teks judul */
        .splash-title {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .splash-title h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: #1a1a2e;
            margin-bottom: 2px;
            line-height: 1.1;
        }

        .splash-title h1 span {
            color: #ff6b35;
        }

        .splash-title p {
            font-size: 0.7rem;
            font-weight: 500;
            color: #6b6b80;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Loading bar — durasi diperpanjang menjadi 10 detik */
        .splash-loader {
            position: relative;
            z-index: 2;
            margin-top: 32px;
            width: 160px;
            height: 4px;
            background: #eef0f4;
            border-radius: 10px;
            overflow: hidden;
        }

        .splash-loader .loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6b35, #f5576c);
            border-radius: 10px;
            animation: loadProgress 10s ease-in-out forwards;
        }

        @keyframes loadProgress {
            0% {
                width: 0%;
            }
            20% {
                width: 18%;
            }
            50% {
                width: 55%;
            }
            80% {
                width: 82%;
            }
            100% {
                width: 100%;
            }
        }

        /* Teks loading */
        .splash-loading-text {
            position: relative;
            z-index: 2;
            margin-top: 12px;
            font-size: 0.55rem;
            font-weight: 500;
            color: #8a8a9e;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .splash-loading-text i {
            font-size: 0.5rem;
            animation: spinDots 1.2s steps(4) infinite;
        }

        @keyframes spinDots {
            0% {
                opacity: 0.2;
            }
            25% {
                opacity: 0.5;
            }
            50% {
                opacity: 0.8;
            }
            75% {
                opacity: 1;
            }
            100% {
                opacity: 0.2;
            }
        }

        /* Versi kecil / watermark */
        .splash-version {
            position: absolute;
            bottom: 28px;
            z-index: 2;
            font-size: 0.5rem;
            color: #b0b0c0;
            font-weight: 500;
            letter-spacing: 0.4px;
            text-align: center;
        }

        .splash-version span {
            color: #ff6b35;
        }

        /* ============================================================
                   GAYA UTAMA APP (sama seperti sebelumnya)
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #1a1a2e;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.04);
        }

        /* ===== HEADER ===== */
        .app-header {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-bottom: 1px solid #e8ecf0;
            flex-shrink: 0;
            z-index: 30;
            position: relative;
            min-height: 64px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-badge {
            width: 42px;
            height: 42px;
            background: #ff6b35;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icon-badge i {
            font-size: 20px;
            color: white;
        }
        .title-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.3px;
        }
        .title-text h1 span {
            color: #ff6b35;
        }
        .title-text p {
            font-size: 0.55rem;
            color: #6b6b80;
            margin-top: 1px;
            letter-spacing: 0.4px;
            font-weight: 500;
        }
        .menu-btn {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            color: #1a1a2e;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-btn:active {
            background: rgba(0, 0, 0, 0.04);
            transform: scale(0.92);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 16px 80px;
            background: #f8f9fc;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .main-content::-webkit-scrollbar {
            width: 3px;
        }
        .main-content::-webkit-scrollbar-track {
            background: #eef0f4;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: #ff6b35;
            border-radius: 10px;
        }

        /* ===== FAKTA HARIAN ===== */
        .fact-card {
            position: relative;
            background: linear-gradient(135deg, #ff6b35 0%, #f5576c 50%, #ff6b6b 100%);
            border-radius: 20px;
            padding: 18px 20px 16px;
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(255, 107, 53, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: default;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .fact-card:active {
            transform: scale(0.98);
        }
        .fact-card::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -40px;
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }
        .fact-card::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            pointer-events: none;
        }

        .fact-badge-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }
        .fact-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 4px 14px 4px 12px;
            border-radius: 100px;
            font-size: 0.6rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .fact-badge i {
            font-size: 0.65rem;
            color: #ffe066;
        }
        .fact-number {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.10);
            padding: 2px 10px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .fact-body {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            position: relative;
            z-index: 2;
        }
        .fact-icon-wrap {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: factPulse 3s ease-in-out infinite;
        }
        .fact-icon-wrap i {
            font-size: 20px;
            color: #fff;
        }
        @keyframes factPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.2);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            }
        }

        .fact-text-wrap {
            flex: 1;
            min-width: 0;
        }
        .fact-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.45;
            letter-spacing: -0.2px;
            margin-bottom: 2px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }
        .fact-text .highlight {
            background: rgba(255, 255, 255, 0.15);
            padding: 0 6px;
            border-radius: 4px;
            font-weight: 700;
        }
        .fact-sub {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }
        .fact-sub i {
            font-size: 0.5rem;
            opacity: 0.6;
        }

        .fact-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
            position: relative;
            z-index: 2;
        }
        .fact-refresh-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .fact-refresh-btn:active {
            transform: scale(0.85) rotate(60deg);
            background: rgba(255, 255, 255, 0.25);
        }
        .fact-refresh-btn i {
            transition: transform 0.4s ease;
        }
        .fact-refresh-btn:active i {
            transform: rotate(180deg);
        }

        .fact-shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
            animation: shimmerSlide 5s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes shimmerSlide {
            0% {
                left: -100%;
            }
            60% {
                left: 150%;
            }
            100% {
                left: 150%;
            }
        }

        /* ===== HOME GRID ===== */
        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .grid-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 14px 6px 12px;
            text-align: center;
            border: 1px solid #e8ecf0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 110px;
        }
        .grid-card:active {
            transform: scale(0.94);
            border-color: #ff6b35;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.08);
        }

        .grid-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 6px;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }
        .grid-card:nth-child(1) .grid-icon {
            background: #ff6b35;
        }
        .grid-card:nth-child(2) .grid-icon {
            background: #00b4d8;
        }
        .grid-card:nth-child(3) .grid-icon {
            background: #f5576c;
        }

        .grid-card h3 {
            font-size: 0.7rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 2px;
            line-height: 1.2;
        }
        .grid-card p {
            font-size: 0.5rem;
            color: #6b6b80;
            line-height: 1.3;
            margin: 0;
        }

        /* ===== INFO WIDGET ===== */
        .info-widget {
            background: #ffffff;
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 6px;
            border-left: 3px solid #ff6b35;
            border: 1px solid #e8ecf0;
        }
        .info-widget i {
            color: #ff6b35;
            margin-right: 6px;
            font-size: 0.65rem;
        }
        .info-text {
            font-size: 0.6rem;
            color: #4a4a5e;
            line-height: 1.4;
        }
        .info-text strong {
            color: #1a1a2e;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin: 4px 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-left: 2px;
            color: #1a1a2e;
        }
        .section-title i {
            font-size: 0.95rem;
        }
        .section-title .fa-qrcode {
            color: #00b4d8;
        }
        .section-title .fa-vr-cardboard {
            color: #f5576c;
        }
        .section-title .fa-robot {
            color: #ff6b35;
        }

        /* ===== AR ===== */
        .ar-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 12px;
            border: 1px solid #e8ecf0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .ar-preview {
            width: 100%;
            height: 180px;
            background: #f0f2f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            border: 1px dashed #d0d4db;
        }
        .ar-placeholder {
            text-align: center;
            color: #6b6b80;
        }
        .ar-placeholder i {
            font-size: 36px;
            margin-bottom: 4px;
            display: block;
            color: #00b4d8;
        }
        .ar-placeholder p {
            font-size: 0.7rem;
            color: #6b6b80;
        }
        .ar-btn {
            background: #00b4d8;
            border: none;
            padding: 10px 16px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .ar-btn:active {
            transform: scale(0.96);
            background: #0090b0;
        }

        /* ===== SCANNER ===== */
        .scanner-container {
            background: #f0f2f6;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 2px solid #d0d4db;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        #scanner-video {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #000;
            display: none;
        }
        #scanner-canvas {
            width: 100%;
            height: 280px;
            display: none;
        }
        .scanner-placeholder {
            width: 100%;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f2f6;
            color: #6b6b80;
            flex-direction: column;
            gap: 8px;
        }
        .scanner-placeholder i {
            font-size: 40px;
            color: #00b4d8;
        }
        .scanner-placeholder p {
            font-size: 0.75rem;
        }
        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scanner-frame {
            width: 180px;
            height: 180px;
            border: 3px solid rgba(0, 180, 216, 0.5);
            border-radius: 12px;
            position: relative;
        }
        .scanner-frame::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 24px;
            height: 24px;
            border-top: 4px solid #00b4d8;
            border-left: 4px solid #00b4d8;
            border-radius: 4px 0 0 0;
        }
        .scanner-frame::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 24px;
            height: 24px;
            border-bottom: 4px solid #00b4d8;
            border-right: 4px solid #00b4d8;
            border-radius: 0 0 4px 0;
        }
        .scanner-controls {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .scanner-controls button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start-scanner {
            background: #00b4d8;
            color: white;
        }
        .btn-stop-scanner {
            background: rgba(255, 60, 60, 0.06);
            color: #d63031;
            border: 1px solid #ff6b6b;
        }
        .btn-start-scanner:active,
        .btn-stop-scanner:active {
            transform: scale(0.95);
        }
        .scan-result {
            background: #f0faf0;
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 10px;
            border-left: 3px solid #00c853;
        }

<body>

        <!-- ===== BOTTOM NAV ===== -->
        <div class="bottom-nav">
            <button class="nav-item active" data-page="home"><i class="fas fa-home"></i><span>Beranda</span></button>
            <button class="nav-item" data-page="scanner"><i class="fas fa-qrcode"></i><span>Scanner</span></button>

    <script>
        // ============================================================
        // SPLASH SCREEN — HIDE AFTER 10 DETIK
        // ============================================================
        (function initSplash() {
            const splash = document.getElementById('splashscreen');
            if (!splash) return;

            // Waktu minimum splash tampil = 10 detik
            const MIN_DISPLAY = 10000; // 10 detik
            const startTime = Date.now();

            function hideSplash() {
                const elapsed = Date.now() - startTime;
                const delay = Math.max(0, MIN_DISPLAY - elapsed);
                setTimeout(() => {
                    splash.classList.add('splash-hidden');
                    // Hapus dari DOM setelah transisi selesai
                    setTimeout(() => {
                        splash.style.display = 'none';
                    }, 800);
                }, delay);
            }

            // Tunggu semua resource (termasuk font & gambar) + minimal waktu
            if (document.readyState === 'complete') {
                hideSplash();
            } else {
                window.addEventListener('load', hideSplash);
                // Fallback: jika load terlalu lama, paksa setelah 10 detik
                setTimeout(hideSplash, 10000);
            }

            // Jika user mengklik/tap di mana saja selama splash, tetap tunggu sampai minimal waktu
            // (tidak melakukan skip agar pengalaman tetap mulus)
        })();


        // ============================================================
        // KODE APP — SAMA SEPERTI SEBELUMNYA
        // ============================================================

        // ===== FAKTA HARIAN =====
        const dailyFacts = [{
            text: 'Entropi alam semesta <span class="highlight">selalu meningkat</span> sesuai Hukum II Termodinamika.',

        }, {
            text: 'Energi <span class="highlight">tidak dapat diciptakan</span> atau dimusnahkan, hanya berubah bentuk (Hukum I).',
            icon: 'fa-bolt',
            label: 'Hukum I'
        }, {
            text: 'Atom terdiri dari inti <span class="highlight">(proton & neutron)</span> dan elektron yang mengorbit.',
            icon: 'fa-atom',
            label: 'Struktur Atom'
        }, {
            text: 'Suhu adalah ukuran <span class="highlight">energi kinetik rata-rata</span> partikel dalam suatu sistem.',
            icon: 'fa-thermometer-half',
            label: 'Suhu'
        }, {
            text: 'Fonon adalah kuantum getaran kisi kristal yang <span class="highlight">meningkat seiring suhu</span>.',

        }, {

            label: 'Mesin Kalor'
        }, {
            text: 'Proses isotermal terjadi pada <span class="highlight">suhu konstan</span>, ΔU = 0.',
            icon: 'fa-circle-notch',
            label: 'Isotermal'
        }, {
            text: 'Proses adiabatik <span class="highlight">tanpa pertukaran kalor</span> dengan lingkungan (Q = 0).',

            label: 'Adiabatik'
        }, {
            text: 'Siklus Carnot memberikan <span class="highlight">efisiensi maksimum</span> untuk mesin kalor.',
            icon: 'fa-sync-alt',
            label: 'Carnot'
        }, {
            text: 'Teori kinetik gas: tekanan gas berasal dari <span class="highlight">tumbukan partikel</span> dengan dinding.',
            icon: 'fa-wind',
            label: 'Gas Ideal'
        }, {
            text: 'Energi dalam (U) adalah total <span class="highlight">energi kinetik & potensial</span> partikel sistem.',
            icon: 'fa-database',
            label: 'Energi Dalam'
        }, {
            text: 'Pompa kalor memindahkan panas dari <span class="highlight">tempat dingin ke hangat</span> menggunakan kerja.',
            icon: 'fa-snowflake',
            label: 'Pompa Kalor'
        }, {
            text: 'Hukum ke-0 Termodinamika: jika dua sistem <span class="highlight">setimbang</span> dengan sistem ketiga, mereka setimbang.',

            label: 'Hukum ke-0'
        }, {
            text: 'Pada 0 K (nol mutlak), <span class="highlight">entropi mendekati nol</span> (Hukum III).',
            icon: 'fa-temperature-low',
            label: 'Hukum III'
        }];

        function getRandomFact() {
            const rand = Math.floor(Math.random() * dailyFacts.length);
            return dailyFacts[rand];
        }

        let currentFactIndex = -1;

        function getFactForDisplay() {
            const today = new Date();
            const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            const index = dayOfYear % dailyFacts.length;
            currentFactIndex = index;
            return dailyFacts[index];
        }

        function renderFactCard(fact) {
            const dateStr = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long',
                year: 'numeric' });
            return `
                        <div class="fact-card" id="factCard">
                            <div class="fact-shimmer"></div>
                            <div class="fact-badge-row">
                                <span class="fact-badge"><i class="fas fa-star"></i> Fakta Hari Ini</span>

                                </button>
                            </div>
                        </div>
                    `;
        }

        // ===== SCANNER =====
        let scannerStream = null;
        let isScannerActive = false;
        let scanAnimationId = null;
        let lastScanTime = 0;
        let isRedirecting = false;

        const pages = {
            home: {
                render: () => {
                    const fact = getFactForDisplay();
                    return `
                                <div id="homePage">
                                    ${renderFactCard(fact)}
                                    <div class="home-grid">

                                                <option value="kecepatan">Kecepatan (v = s / t)</option>

                                                <option value="kalor">Kalor (Q = m × c × ΔT)</option>
                                            </select>

                                        <div class="calc-row">

                                        </div>
                                        <div class="calc-result" id="calcResult">
                                            <i class="fas fa-check-circle"></i>
                                            <span>Masukkan nilai dan tekan Hitung</span>
                                        </div>
                                    </div>
                                    <div class="info-widget">
                                        <i class="fas fa-atom"></i>
                                        <span class="info-text"><strong>Fakta:</strong> Entropi alam semesta selalu meningkat (Hk.II). Energi tidak dapat diciptakan/dimusnahkan (Hk.I).</span>
                                    </div>
                                </div>
                            `;
                }
            },
            scanner: {
                render: () => `

                            <div class="scanner-container" id="scannerContainer">

        // ===== SCANNER FUNCTIONS =====
        function stopScanner() {
            if (scannerStream) {
                try { scannerStream.getTracks().forEach(track => track.stop());
                    scannerStream = null; } catch (e) { console.log('Error stopping stream:', e); }
            }
            if (scanAnimationId) { cancelAnimationFrame(scanAnimationId);
                scanAnimationId = null; }
            isScannerActive = false;
            const video = document.getElementById('scanner-video');
            const canvas = document.getElementById('scanner-canvas');
            const placeholder = document.getElementById('scannerPlaceholder');
            const container = document.getElementById('scannerContainer');

                video.srcObject = null; }

            if (frame) { frame.style.borderColor = 'rgba(0, 180, 216, 0.5)'; }

        function showRedirectNotification(url) {
            const oldNotif = document.querySelector('.redirect-notification');
            if (oldNotif) oldNotif.remove();
            const notif = document.createElement('div');
            notif.className = 'redirect-notification';
            notif.innerHTML = `
                        <i class="fas fa-link"></i>
                        <h3>📱 Membuka Link...</h3>
                        <p>${url}</p>
                        <div>
                            <button class="btn-redirect" onclick="openLinkDirectly('${url}')">
                                <i class="fas fa-external-link-alt"></i> Buka Sekarang
                            </button>
                            <button class="btn-cancel" onclick="this.closest('.redirect-notification').remove()">
                                <i class="fas fa-times"></i> Batal
                            </button>
                        </div>
                    `;
            document.body.appendChild(notif);
            setTimeout(() => {
                const notifEl = document.querySelector('.redirect-notification');
                if (notifEl) { openLinkDirectly(url);
                    notifEl.remove(); }
            }, 3000);
        }

        function openLinkDirectly(url) {
            if (isRedirecting) return;
            isRedirecting = true;
            try {
                let finalUrl = url.trim();
                if (!finalUrl.match(/^https?:\/\//i) && !finalUrl.match(/^[a-zA-Z]+:\/\//)) {
                    if (finalUrl.match(/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/)) {
                        finalUrl = 'https://' + finalUrl;
                    } else {
                        alert('Hasil Scan: ' + finalUrl);
                        isRedirecting = false;
                        return;
                    }
                }
                try {
                    const win = window.open(finalUrl, '_blank');
                    if (!win || win.closed) { window.location.href = finalUrl; }
                } catch (e) { window.location.href = finalUrl; }
                setTimeout(() => { stopScanner(); }, 500);
            } catch (e) { alert('Tidak dapat membuka link: ' + url); }
            setTimeout(() => { isRedirecting = false; }, 2000);
        }

        function scanFrame() {
            if (!isScannerActive) return;
            const video = document.getElementById('scanner-video');
            const canvas = document.getElementById('scanner-canvas');
            if (!video || !canvas) { scanAnimationId = requestAnimationFrame(scanFrame); return; }
            try {
                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    try {
                        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                        if (code && code.data) {
                            const now = Date.now();
                            if (now - lastScanTime > 2000) { lastScanTime = now;
                                handleScanResult(code.data); }
                        }
                    } catch (e) {}
                }
            } catch (e) {}
            scanAnimationId = requestAnimationFrame(scanFrame);
        }

        function handleScanResult(content) {
            const resultContainer = document.getElementById('scanResult');
            const resultText = document.getElementById('scanResultText');
            const openLinkBtn = document.getElementById('openLinkBtn');
            const frame = document.getElementById('scannerFrame');
            if (resultContainer && resultText) {
                resultContainer.classList.remove('hidden');
                let displayText = content;
                let isUrl = false;
                try {
                    const data = JSON.parse(content);
                    displayText = JSON.stringify(data, null, 2);
                    if (data.url) { content = data.url;
                        isUrl = true; } else if (data.link) { content = data.link;
                        isUrl = true; }
                } catch (e) {
                    if (content.match(/^https?:\/\//i) || content.match(/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/)) { isUrl = true; }
                    displayText = content;
                }
                resultText.textContent = displayText;
                if (openLinkBtn) {
                    if (isUrl) {
                        openLinkBtn.style.display = 'block';
                        openLinkBtn.onclick = function() { openLinkDirectly(content); };
                    } else { openLinkBtn.style.display = 'none'; }
                }
                if (frame) {
                    frame.style.borderColor = '#00c853';
                    setTimeout(() => { frame.style.borderColor = 'rgba(0, 180, 216, 0.5)'; }, 500);
                }
                if (navigator.vibrate) { navigator.vibrate(100); }
                try {
                    const audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';
                    gainNode.gain.value = 0.3;
                    oscillator.start();
                    setTimeout(() => { oscillator.stop(); }, 150);
                } catch (e) {}
                if (isUrl) { showRedirectNotification(content); }
            }
        }

        function startScanner() {
            const video = document.getElementById('scanner-video');
            const canvas = document.getElementById('scanner-canvas');
            const placeholder = document.getElementById('scannerPlaceholder');
            const container = document.getElementById('scannerContainer');
            const frame = document.getElementById('scannerFrame');
            if (!video) return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Browser Anda tidak mendukung akses kamera. Gunakan browser terbaru.');
                return;
            }
            stopScanner();
            if (placeholder) { placeholder.innerHTML = '<i class="fas fa-spinner fa-spin"></i><p>Mengakses kamera...</p>'; }
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
            }).then(function(stream) {
                scannerStream = stream;
                video.srcObject = stream;
                video.style.display = 'block';
                if (canvas) { canvas.style.display = 'none'; }
                if (placeholder) { placeholder.style.display = 'none'; }
                if (container) { container.classList.add('scanning-active'); }
                if (frame) { frame.style.borderColor = 'rgba(0, 180, 216, 0.5)'; }
                isScannerActive = true;
                video.onloadedmetadata = function() {
                    video.play();
                    if (scanAnimationId) cancelAnimationFrame(scanAnimationId);
                    scanFrame();
                };
                video.onerror = function() { alert('Error pada video stream. Coba refresh halaman.');
                    stopScanner(); };
            }).catch(function(err) {
                console.error('Error accessing camera:', err);
                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                }).then(function(stream) {
                    scannerStream = stream;
                    video.srcObject = stream;
                    video.style.display = 'block';
                    if (canvas) { canvas.style.display = 'none'; }
                    if (placeholder) { placeholder.style.display = 'none'; }
                    if (container) { container.classList.add('scanning-active'); }
                    if (frame) { frame.style.borderColor = 'rgba(0, 180, 216, 0.5)'; }
                    isScannerActive = true;
                    video.onloadedmetadata = function() {
                        video.play();
                        if (scanAnimationId) cancelAnimationFrame(scanAnimationId);
                        scanFrame();
                    };
                    video.onerror = function() { alert('Error pada video stream. Coba refresh halaman.');
                        stopScanner(); };
                }).catch(function(err2) {
                    console.error('Error accessing front camera:', err2);
                    if (placeholder) {
                        placeholder.innerHTML =
                            '<i class="fas fa-exclamation-triangle" style="color:#ff6b6b;"></i><p>Tidak dapat mengakses kamera. Pastikan Anda memberikan izin.</p>';
                    }
                    alert('Tidak dapat mengakses kamera. Pastikan Anda memberikan izin akses kamera dan menggunakan HTTPS.');
                });
            });
        }

        // ===== KALKULATOR FISIKA =====
        function setupCalculator() {
            const typeSelect = document.getElementById('calcType');
            const inputsContainer = document.getElementById('calcInputs');
            const calcBtn = document.getElementById('calcBtn');
            const resultDiv = document.getElementById('calcResult');

            if (!typeSelect || !inputsContainer || !calcBtn || !resultDiv) return;

            const formulas = {
                kecepatan: {
                    label: 'Kecepatan (v = s / t)',
                    fields: [
                        { name: 's', label: 'Jarak (s)', unit: 'm', placeholder: 'misal 100' },
                        { name: 't', label: 'Waktu (t)', unit: 's', placeholder: 'misal 5' }
                    ],
                    calculate: (vals) => {
                        const s = parseFloat(vals.s);
                        const t = parseFloat(vals.t);
                        if (isNaN(s) || isNaN(t) || t === 0) return null;
                        return { value: s / t, unit: 'm/s' };
                    }
                },
                gaya: {
                    label: 'Gaya (F = m × a)',
                    fields: [
                        { name: 'm', label: 'Massa (m)', unit: 'kg', placeholder: 'misal 10' },
                        { name: 'a', label: 'Percepatan (a)', unit: 'm/s²', placeholder: 'misal 2' }
                    ],
                    calculate: (vals) => {
                        const m = parseFloat(vals.m);
                        const a = parseFloat(vals.a);
                        if (isNaN(m) || isNaN(a)) return null;
                        return { value: m * a, unit: 'N' };
                    }
                },
                usaha: {
                    label: 'Usaha (W = F × s)',
                    fields: [
                        { name: 'F', label: 'Gaya (F)', unit: 'N', placeholder: 'misal 50' },
                        { name: 's', label: 'Jarak (s)', unit: 'm', placeholder: 'misal 3' }
                    ],
                    calculate: (vals) => {
                        const F = parseFloat(vals.F);
                        const s = parseFloat(vals.s);
                        if (isNaN(F) || isNaN(s)) return null;
                        return { value: F * s, unit: 'J' };
                    }
                },
                energi_kinetik: {
                    label: 'Energi Kinetik (Ek = ½ m v²)',
                    fields: [
                        { name: 'm', label: 'Massa (m)', unit: 'kg', placeholder: 'misal 5' },
                        { name: 'v', label: 'Kecepatan (v)', unit: 'm/s', placeholder: 'misal 10' }
                    ],
                    calculate: (vals) => {
                        const m = parseFloat(vals.m);
                        const v = parseFloat(vals.v);
                        if (isNaN(m) || isNaN(v)) return null;
                        return { value: 0.5 * m * v * v, unit: 'J' };
                    }
                },
                tekanan: {
                    label: 'Tekanan (P = F / A)',
                    fields: [
                        { name: 'F', label: 'Gaya (F)', unit: 'N', placeholder: 'misal 100' },
                        { name: 'A', label: 'Luas (A)', unit: 'm²', placeholder: 'misal 0.5' }
                    ],
                    calculate: (vals) => {
                        const F = parseFloat(vals.F);
                        const A = parseFloat(vals.A);
                        if (isNaN(F) || isNaN(A) || A === 0) return null;
                        return { value: F / A, unit: 'Pa' };
                    }
                },
                hukum_ohm: {
                    label: 'Hukum Ohm (V = I × R)',
                    fields: [
                        { name: 'I', label: 'Arus (I)', unit: 'A', placeholder: 'misal 2' },
                        { name: 'R', label: 'Hambatan (R)', unit: 'Ω', placeholder: 'misal 5' }
                    ],
                    calculate: (vals) => {
                        const I = parseFloat(vals.I);
                        const R = parseFloat(vals.R);
                        if (isNaN(I) || isNaN(R)) return null;
                        return { value: I * R, unit: 'V' };
                    }
                },
                daya: {
                    label: 'Daya (P = W / t)',
                    fields: [
                        { name: 'W', label: 'Usaha (W)', unit: 'J', placeholder: 'misal 200' },
                        { name: 't', label: 'Waktu (t)', unit: 's', placeholder: 'misal 4' }
                    ],
                    calculate: (vals) => {
                        const W = parseFloat(vals.W);
                        const t = parseFloat(vals.t);
                        if (isNaN(W) || isNaN(t) || t === 0) return null;
                        return { value: W / t, unit: 'W' };
                    }
                },
                kalor: {
                    label: 'Kalor (Q = m × c × ΔT)',
                    fields: [
                        { name: 'm', label: 'Massa (m)', unit: 'kg', placeholder: 'misal 2' },
                        { name: 'c', label: 'Kalor jenis (c)', unit: 'J/kg°C', placeholder: 'misal 4200' },
                        { name: 'dt', label: 'Perubahan suhu (ΔT)', unit: '°C', placeholder: 'misal 10' }
                    ],
                    calculate: (vals) => {
                        const m = parseFloat(vals.m);
                        const c = parseFloat(vals.c);
                        const dt = parseFloat(vals.dt);
                        if (isNaN(m) || isNaN(c) || isNaN(dt)) return null;
                        return { value: m * c * dt, unit: 'J' };
                    }
                }
            };

            function updateInputs() {
                const type = typeSelect.value;
                const formula = formulas[type];
                if (!formula) return;
                let html = '';
                formula.fields.forEach(field => {
                    html += `
                                <div style="flex:1; min-width: 80px;">
                                    <label style="font-size:0.6rem; font-weight:600; color:#4a4a5e; display:block; margin-bottom:2px;">${field.label}</label>
                                    <input type="number" step="any" id="calc_${field.name}" placeholder="${field.placeholder}" style="width:100%; padding:8px 12px; border:1px solid #d0d4db; border-radius:10px; font-size:0.75rem; background:#f8f9fc; outline:none; transition:0.2s;">
                                </div>
                            `;
                });
                inputsContainer.innerHTML = html;
                inputsContainer.querySelectorAll('input').forEach(inp => {
                    inp.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') calcBtn.click();
                    });
                });
            }

            function calculate() {
                const type = typeSelect.value;
                const formula = formulas[type];
                if (!formula) return;
                const vals = {};
                let valid = true;
                formula.fields.forEach(field => {
                    const el = document.getElementById(`calc_${field.name}`);
                    if (el) {
                        const val = el.value.trim();
                        if (val === '') {
                            valid = false;
                        } else {
                            vals[field.name] = val;
                        }
                    }
                });
                if (!valid) {
                    resultDiv.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#ff6b6b;"></i> <span style="color:#d63031;">Harap isi semua nilai dengan benar.</span>`;
                    return;
                }
                const result = formula.calculate(vals);
                if (result === null) {
                    resultDiv.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#ff6b6b;"></i> <span style="color:#d63031;">Periksa kembali nilai (pembagian dengan nol atau nilai tidak valid).</span>`;
                    return;
                }
                resultDiv.innerHTML = `
                            <i class="fas fa-check-circle"></i>
                            <span><span class="result-label">Hasil:</span> <span class="result-value">${result.value.toFixed(4)}</span> ${result.unit}</span>
                        `;
            }

            typeSelect.addEventListener('change', updateInputs);
            calcBtn.addEventListener('click', calculate);
            updateInputs();
        }
