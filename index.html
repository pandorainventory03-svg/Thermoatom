<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ff6e2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThermoAtom - Aplikasi Termodinamika</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0B0F19;
            min-height: 100vh;
            color: #EFF3FC;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(18, 25, 45, 0.85);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 0 1px rgba(255, 140, 80, 0.2);
            position: relative;
        }

        .app-header {
            padding: 12px 16px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 140, 80, 0.25);
            background: rgba(10, 15, 28, 0.5);
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(20px);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .icon-badge {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ff8844, #ff5e2e);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .icon-badge i {
            font-size: 18px;
            color: white;
        }
        .title-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(120deg, #FFFFFF, #D6E6FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .title-text p {
            font-size: 0.55rem;
            color: #9aa9c9;
            margin-top: 1px;
        }
        .menu-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.95);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 90px;
        }

        .card {
            background: rgba(25, 32, 50, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 120, 70, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .card:active {
            transform: scale(0.98);
            background: rgba(40, 50, 72, 0.85);
        }
        .card-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .card-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 110, 46, 0.2);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ff9955;
        }
        .card-info {
            flex: 1;
        }
        .card-info h3 {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .card-info p {
            font-size: 0.65rem;
            color: #b7c2e2;
            line-height: 1.35;
        }
        .chevron-icon {
            color: #ffaa66;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .info-widget {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 12px 14px;
            margin-top: 8px;
            border-left: 3px solid #ff8844;
        }
        .info-widget i {
            color: #ffaa55;
            margin-right: 6px;
            font-size: 0.7rem;
        }
        .info-text {
            font-size: 0.65rem;
            color: #cbd5f0;
            line-height: 1.4;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin: 6px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 2px;
        }
        .section-title i {
            color: #ff8844;
            font-size: 1rem;
        }

        .ar-container {
            background: linear-gradient(135deg, #1a2a3a, #0a1520);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 140, 80, 0.4);
        }
        .ar-preview {
            width: 100%;
            height: 200px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }
        .ar-placeholder {
            text-align: center;
            color: #ffaa66;
        }
        .ar-placeholder i {
            font-size: 48px;
            margin-bottom: 8px;
            display: block;
        }
        .ar-btn {
            background: linear-gradient(135deg, #ff8844, #ff5e2e);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
        }
        .ar-btn:active {
            transform: scale(0.97);
        }

        .anim-card {
            background: rgba(25, 32, 50, 0.7);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: center;
        }
        .atom-animation {
            width: 100%;
            height: 150px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            position: relative;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .nucleus {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #ff8844, #ff4400);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #ff8844;
        }
        .electron {
            width: 10px;
            height: 10px;
            background: #ffcc77;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px #ffaa55;
        }
        .play-anim-btn {
            background: rgba(255, 136, 68, 0.3);
            border: 1px solid #ff8844;
            padding: 8px 16px;
            border-radius: 30px;
            color: #ffaa66;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Bottom Navigation - Hanya 4 menu */
        .bottom-nav {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: rgba(10, 16, 26, 0.96);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px 20px;
            border-top: 0.5px solid rgba(255, 140, 80, 0.35);
            z-index: 40;
            width: 100%;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #8a96b8;
            font-size: 11px;
            padding: 6px 0;
            border-radius: 40px;
            transition: all 0.2s;
            cursor: pointer;
            font-weight: 500;
        }
        .nav-item i {
            font-size: 20px;
        }
        .nav-item.active {
            color: #ff8844;
            background: rgba(255, 136, 68, 0.12);
        }
        .nav-item:active {
            transform: scale(0.95);
        }

        .main-content::-webkit-scrollbar {
            width: 3px;
        }
        .main-content::-webkit-scrollbar-track {
            background: #1a1f2e;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: #ff8844;
            border-radius: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <div class="logo-area">
            <div class="icon-badge"><i class="fas fa-atom"></i></div>
            <div class="title-text">
                <h1>Thermo<span style="color:#ffaa66;">Atom</span></h1>
                <p>Hukum 0, I, II · AR & Animasi</p>
            </div>
        </div>
        <button class="menu-btn" id="menuBtn"><i class="fas fa-ellipsis-v"></i></button>
    </div>

    <div class="main-content" id="mainContent"></div>

    <!-- Bottom Navigation - Hanya 4 menu: Beranda, Simulasi, Scanner, AR -->
    <div class="bottom-nav">
        <button class="nav-item active" data-page="home"><i class="fas fa-home"></i><span>Beranda</span></button>
        <button class="nav-item" data-page="simulation"><i class="fas fa-play-circle"></i><span>Simulasi</span></button>
        <button class="nav-item" data-page="scanner"><i class="fas fa-qrcode"></i><span>Scanner</span></button>
        <button class="nav-item" data-page="ar"><i class="fas fa-vr-cardboard"></i><span>AR</span></button>
    </div>
</div>

<script>
    let animInterval = null;
    
    function startElectronAnimation() {
        const container = document.getElementById('electronAnimContainer');
        if (!container) return;
        
        if (animInterval) clearInterval(animInterval);
        
        container.innerHTML = `
            <div class="nucleus"></div>
            <div class="electron" id="electron1" style="top: 50%; left: 50%;"></div>
            <div class="electron" id="electron2" style="top: 50%; left: 50%;"></div>
            <div class="electron" id="electron3" style="top: 50%; left: 50%;"></div>
        `;
        
        let angle1 = 0, angle2 = 120, angle3 = 240;
        const radius = 50;
        
        function updatePositions() {
            const containerRect = container.getBoundingClientRect();
            const centerX = containerRect.width / 2;
            const centerY = containerRect.height / 2;
            
            const e1 = document.getElementById('electron1');
            const e2 = document.getElementById('electron2');
            const e3 = document.getElementById('electron3');
            if (!e1 || !e2 || !e3) {
                clearInterval(animInterval);
                return;
            }
            
            angle1 = (angle1 + 3) % 360;
            angle2 = (angle2 + 3) % 360;
            angle3 = (angle3 + 3) % 360;
            
            const rad1 = angle1 * Math.PI / 180;
            const rad2 = angle2 * Math.PI / 180;
            const rad3 = angle3 * Math.PI / 180;
            
            e1.style.left = (centerX + radius * Math.cos(rad1) - 5) + 'px';
            e1.style.top = (centerY + radius * Math.sin(rad1) - 5) + 'px';
            e2.style.left = (centerX + radius * Math.cos(rad2) - 5) + 'px';
            e2.style.top = (centerY + radius * Math.sin(rad2) - 5) + 'px';
            e3.style.left = (centerX + radius * Math.cos(rad3) - 5) + 'px';
            e3.style.top = (centerY + radius * Math.sin(rad3) - 5) + 'px';
        }
        
        updatePositions();
        animInterval = setInterval(updatePositions, 30);
        
        window.addEventListener('resize', () => {
            if (animInterval) updatePositions();
        });
    }

    const pages = {
        home: {
            render: () => `
                <div id="homePage">
                    <div class="card" data-nav="sementara.html">
                        <div class="card-row">
                            <div class="card-icon"><i class="fas fa-cubes"></i></div>
                            <div class="card-info">
                                <h3>Simulasi 3D Termodinamika</h3>
                                <p>Model atom interaktif, kisi kristal, entropi & energi dalam.</p>
                            </div>
                            <div class="chevron-icon"><i class="fas fa-chevron-right"></i></div>
                        </div>
                    </div>
                    <div class="card" data-page="laws">
                        <div class="card-row">
                            <div class="card-icon"><i class="fas fa-gavel"></i></div>
                            <div class="card-info">
                                <h3>Hukum Termodinamika</h3>
                                <p>Pelajari Hukum 0, I, II dengan contoh fisika dan entropi.</p>
                            </div>
                            <div class="chevron-icon"><i class="fas fa-chevron-right"></i></div>
                        </div>
                    </div>
                    <div class="card" data-nav="scanner.html">
                        <div class="card-row">
                            <div class="card-icon"><i class="fas fa-qrcode"></i></div>
                            <div class="card-info">
                                <h3>QR Scanner Edukasi</h3>
                                <p>Scan kode QR materi termodinamika & struktur atom.</p>
                            </div>
                            <div class="chevron-icon"><i class="fas fa-chevron-right"></i></div>
                        </div>
                    </div>
                    <div class="card" data-page="ar">
                        <div class="card-row">
                            <div class="card-icon"><i class="fas fa-vr-cardboard"></i></div>
                            <div class="card-info">
                                <h3>Augmented Reality (AR)</h3>
                                <p>Lihat model atom 3D langsung di dunia nyata melalui kamera.</p>
                            </div>
                            <div class="chevron-icon"><i class="fas fa-chevron-right"></i></div>
                        </div>
                    </div>
                    <div class="card" data-page="sementara.html">
                        <div class="card-row">
                            <div class="card-icon"><i class="fas fa-film"></i></div>
                            <div class="card-info">
                                <h3>Animasi Molekuler</h3>
                                <p>Animasi gerak elektron, vibrasi molekul, dan energi termal.</p>
                            </div>
                            <div class="chevron-icon"><i class="fas fa-chevron-right"></i></div>
                        </div>
                    </div>
                    <div class="info-widget">
                        <i class="fas fa-atom"></i>
                        <span class="info-text"><strong>Fakta:</strong> Entropi alam semesta selalu meningkat (Hk.II). Energi tidak dapat diciptakan/dimusnahkan (Hk.I).</span>
                    </div>
                </div>
            `
        },
        simulation: {
            render: () => `
                <div class="section-title"><i class="fas fa-play-circle"></i> Simulasi Energi & Atom</div>
                <div class="card" data-nav="hukum.html">
                    <div class="card-row">
                        <div class="card-icon"><i class="fas fa-rocket"></i></div>
                        <div class="card-info">
                            <h3>Simulasi 3D Penuh</h3>
                            <p>Visualisasi inti atom, elektron, kisi kristal, dan partikel termal (fonon).</p>
                        </div>
                        <div class="chevron-icon"><i class="fas fa-chevron-right"></i></div>
                    </div>
                </div>
                <div class="info-widget">
                    <i class="fas fa-lightbulb"></i>
                    <span class="info-text"><strong>Tips:</strong> Gunakan dua jari untuk rotasi dan zoom. Amati vibrasi atom saat suhu meningkat!</span>
                </div>
                <div class="info-widget">
                    <i class="fas fa-charging-station"></i>
                    <span class="info-text"><strong>Prinsip:</strong> Energi Dalam (U) dipengaruhi Q_in & Q_out. Entropi ↑ sesuai Hk.II.</span>
                </div>
            `
        },
        scanner: {
            render: () => `
                <div class="section-title"><i class="fas fa-qrcode"></i> QR & Barcode Scanner</div>
                <div class="card" data-nav="scanner.html">
                    <div class="card-row">
                        <div class="card-icon"><i class="fas fa-camera"></i></div>
                        <div class="card-info">
                            <h3>Buka Scanner</h3>
                            <p>Scan kode QR materi termodinamika, notasi fisika, atau kuis interaktif.</p>
                        </div>
                        <div class="chevron-icon"><i class="fas fa-chevron-right"></i></div>
                    </div>
                </div>
                <div class="info-widget">
                    <i class="fas fa-info-circle"></i>
                    <span class="info-text"><strong>Informasi:</strong> Arahkan kamera ke kode QR. Contoh hasil: "Hk.II - Entropi meningkat" atau "ΔU = Q - W".</span>
                </div>
            `
        },
        ar: {
            render: () => `
                <div class="section-title"><i class="fas fa-vr-cardboard"></i> Augmented Reality</div>
                <div class="ar-container">
                    <div class="ar-preview" id="arPreview">
                        <div class="ar-placeholder">
                            <i class="fas fa-camera"></i>
                            <p>AR akan membuka kamera untuk menampilkan model atom 3D di lingkungan nyata</p>
                        </div>
                    </div>
                    <button class="ar-btn" id="startARBtn">
                        <i class="fas fa-play"></i> Mulai AR (Lihat Atom 3D)
                    </button>
                </div>
                <div class="info-widget">
                    <i class="fas fa-info-circle"></i>
                    <span class="info-text"><strong>Cara Penggunaan AR:</strong> Klik tombol "Mulai AR", izinkan akses kamera, lalu arahkan ke permukaan datar untuk melihat model atom 3D berinteraksi.</span>
                </div>
                <div class="info-widget">
                    <i class="fas fa-lightbulb"></i>
                    <span class="info-text"><strong>Fitur AR:</strong> Tampilkan model atom helium, elektron berotasi, dan informasi energi dalam secara real-time.</span>
                </div>
            `
        },
        animation: {
            render: () => `
                <div class="section-title"><i class="fas fa-film"></i> Animasi Molekuler</div>
                <div class="anim-card">
                    <h3 style="margin-bottom: 8px; font-size:0.85rem;">⚛️ Gerak Elektron pada Atom</h3>
                    <div class="atom-animation" id="electronAnimContainer"></div>
                    <button class="play-anim-btn" id="startAnimBtn"><i class="fas fa-play"></i> Putar Animasi</button>
                </div>
                <div class="anim-card">
                    <div class="card-row">
                        <div class="card-icon"><i class="fas fa-waveform"></i></div>
                        <div class="card-info">
                            <h3>Vibrasi Molekul (Fonon)</h3>
                            <p>Simulasi getaran kisi kristal akibat energi termal. Semakin tinggi suhu, semakin cepat vibrasi.</p>
                        </div>
                    </div>
                    <button class="play-anim-btn" id="vibrationBtn" style="margin-top: 12px;"><i class="fas fa-chart-line"></i> Lihat Animasi Vibrasi</button>
                </div>
                <div class="info-widget">
                    <i class="fas fa-microscope"></i>
                    <span class="info-text"><strong>Fenomena:</strong> Getaran atom (fonon) meningkat seiring suhu, menyebabkan entropi bertambah (Hukum II Termodinamika).</span>
                </div>
                <button class="play-anim-btn" id="backHomeBtn" style="margin-top: 12px; width:100%;"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</button>
            `
        },
        laws: {
            render: () => `
                <div class="section-title"><i class="fas fa-gavel"></i> Tiga Hukum Termodinamika</div>
                <div class="card">
                    <div class="card-row">
                        <div class="card-icon"><i class="fas fa-balance-scale"></i></div>
                        <div class="card-info">
                            <h3>Hukum ke-0 (Kesetimbangan Termal)</h3>
                            <p>Jika sistem A setimbang termal dengan B, dan B setimbang dengan C, maka A setimbang dengan C.</p>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-row">
                        <div class="card-icon"><i class="fas fa-charging-station"></i></div>
                        <div class="card-info">
                            <h3>Hukum I (Kekekalan Energi)</h3>
                            <p>ΔU = Q - W. Energi dalam sistem berubah karena kalor dan kerja. Energi tidak dapat diciptakan atau dimusnahkan.</p>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-row">
                        <div class="card-icon"><i class="fas fa-chart-line"></i></div>
                        <div class="card-info">
                            <h3>Hukum II (Entropi)</h3>
                            <p>Entropi total alam semesta selalu meningkat pada proses spontan. ΔS ≥ 0.</p>
                        </div>
                    </div>
                </div>
                <div class="info-widget">
                    <i class="fas fa-microscope"></i>
                    <span class="info-text"><strong>Aplikasi:</strong> Getaran kisi (fonon) meningkat seiring suhu → entropi naik. Elektron bergerak lebih cepat.</span>
                </div>
                <button class="play-anim-btn" id="backHomeFromLaws" style="margin-top: 12px; width:100%;"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</button>
            `
        }
    };

    let currentPage = 'home';

    function navigateToFile(filename) {
        try {
            window.location.href = filename;
        } catch(e) {
            alert("File '" + filename + "' belum tersedia. Buat file tersebut terlebih dahulu.");
        }
    }

    function stopAnimation() {
        if (animInterval) {
            clearInterval(animInterval);
            animInterval = null;
        }
    }

    function setupPageEvents(pageId) {
        if (pageId === 'home') {
            document.querySelectorAll('.card[data-page]').forEach(card => {
                card.addEventListener('click', (e) => {
                    const targetPage = card.getAttribute('data-page');
                    if (targetPage && pages[targetPage]) renderPage(targetPage);
                });
            });
            document.querySelectorAll('.card[data-nav]').forEach(card => {
                card.addEventListener('click', (e) => {
                    const targetFile = card.getAttribute('data-nav');
                    if (targetFile) navigateToFile(targetFile);
                });
            });
        }
        
        if (pageId === 'simulation') {
            document.querySelectorAll('.card[data-nav]').forEach(card => {
                card.addEventListener('click', (e) => {
                    const targetFile = card.getAttribute('data-nav');
                    if (targetFile) navigateToFile(targetFile);
                });
            });
        }
        
        if (pageId === 'scanner') {
            document.querySelectorAll('.card[data-nav]').forEach(card => {
                card.addEventListener('click', (e) => {
                    const targetFile = card.getAttribute('data-nav');
                    if (targetFile) navigateToFile(targetFile);
                });
            });
        }
        
        if (pageId === 'ar') {
            const arBtn = document.getElementById('startARBtn');
            if (arBtn) {
                arBtn.addEventListener('click', () => {
                    alert("📱 Fitur AR:\n\nArahkan kamera ke permukaan datar. Model atom 3D akan muncul.\n\nCatatan: Untuk pengalaman AR penuh, gunakan browser yang mendukung WebXR atau aplikasi dengan library AR.js.\n\nDemo: Model atom Helium dengan elektron berotasi di sekitar inti.");
                });
            }
        }
        
        if (pageId === 'animation') {
            const startBtn = document.getElementById('startAnimBtn');
            const vibrationBtn = document.getElementById('vibrationBtn');
            const backBtn = document.getElementById('backHomeBtn');
            
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    startElectronAnimation();
                });
            }
            
            if (vibrationBtn) {
                vibrationBtn.addEventListener('click', () => {
                    alert("🎬 Animasi Vibrasi Molekul:\n\nKetika suhu meningkat, atom-atom dalam kisi kristal bergetar lebih cepat. Fenomena ini disebut FONON. Semakin tinggi energi termal → amplitudo getaran membesar → entropi sistem meningkat (Hk.II Termodinamika).\n\nDalam simulasi 3D, Anda dapat melihat partikel-partikel bergerak acak semakin cepat saat suhu dinaikkan.");
                });
            }
            
            if (backBtn) {
                backBtn.addEventListener('click', () => {
                    renderPage('home');
                });
            }
            
            setTimeout(() => startElectronAnimation(), 100);
        }
        
        if (pageId === 'laws') {
            const backBtn = document.getElementById('backHomeFromLaws');
            if (backBtn) {
                backBtn.addEventListener('click', () => {
                    renderPage('home');
                });
            }
        }
    }

    function renderPage(pageId) {
        const container = document.getElementById('mainContent');
        if (!container) return;
        
        const pageData = pages[pageId];
        if (!pageData) return;
        
        stopAnimation();
        container.innerHTML = pageData.render();
        currentPage = pageId;
        
        setTimeout(() => setupPageEvents(pageId), 50);
        
        document.querySelectorAll('.nav-item').forEach(btn => {
            const btnPage = btn.getAttribute('data-page');
            if (btnPage === pageId) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
            const page = btn.getAttribute('data-page');
            if (page && pages[page]) renderPage(page);
        });
    });

    document.getElementById('menuBtn')?.addEventListener('click', () => {
        alert("📱 ThermoAtom v2.0\n\n• Beranda - Fitur utama (Simulasi, Hukum, Scanner, AR, Animasi)\n• Simulasi - Simulasi 3D atom\n• Scanner - QR scanner edukasi\n• AR - Augmented Reality atom 3D\n\nMenu Animasi dan Hukum dapat diakses dari halaman Beranda.");
    });

    renderPage('home');
</script>
</body>
</html>
