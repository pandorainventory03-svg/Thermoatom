<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulasi Gelombang Termodinamika | Fonon & Getaran Kisi | Hukum Termodinamika</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #010018;
            color: #f0f0f0;
        }
        /* Panel kontrol */
        .control-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(5, 8, 25, 0.92);
            backdrop-filter: blur(18px);
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            padding: 18px 22px 28px;
            border-top: 1px solid rgba(0, 255, 200, 0.4);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 40;
            pointer-events: auto;
        }
        .control-panel.hide-panel {
            transform: translateY(100%);
        }
        .toggle-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 50;
            border: 1px solid #2effcc;
            transition: 0.2s;
        }
        .toggle-btn:active { transform: scale(0.96); background: #1effbb; color: black; }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        input[type="range"] {
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #00aaff, #88ffaa, #ff8844, #ff3300);
            border-radius: 10px;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            width: 22px;
            height: 22px;
            background: #ffffaa;
            border-radius: 50%;
            border: 2px solid #0af;
            cursor: pointer;
            box-shadow: 0 0 8px cyan;
        }
        .wave-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #000000aa;
            backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
            border-left: 3px solid #2effcc;
            pointer-events: none;
            z-index: 22;
        }
        .temp-badge-wave {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #000000aa;
            backdrop-filter: blur(12px);
            padding: 6px 20px;
            border-radius: 50px;
            font-family: monospace;
            font-weight: bold;
            text-align: center;
            border-right: 3px solid #ff8844;
            z-index: 22;
        }
        .stats-wave {
            display: flex;
            gap: 12px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .stat-wave-card {
            background: rgba(0, 20, 30, 0.7);
            border-radius: 24px;
            padding: 8px 12px;
            flex: 1;
            text-align: center;
            backdrop-filter: blur(4px);
            border-bottom: 2px solid #2effaa;
        }
        .reset-wave {
            background: linear-gradient(95deg, #ff4400, #ff9900);
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            cursor: pointer;
        }
        .law-hint {
            font-size: 9px;
            text-align: center;
            margin-top: 10px;
            opacity: 0.7;
        }
        @media (max-width: 550px) {
            .stat-wave-card .label { font-size: 9px; }
            .temp-badge-wave { font-size: 10px; padding: 4px 12px; top: 10px; right: 10px; }
            .wave-badge { font-size: 9px; top: 10px; left: 10px; }
            .toggle-btn { bottom: 15px; right: 15px; padding: 6px 14px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="wave-badge">
        <i class="fas fa-waveform"></i> <span id="waveModeLabel">Gelomb Berjalan | Fonon Akustik</span>
    </div>
    <div class="temp-badge-wave">
        <i class="fas fa-temperature-low"></i> ΔT = <span id="waveAnomaly">+0.0</span>°C &nbsp;|&nbsp; 
        <i class="fas fa-charging-station"></i> <span id="energyWave">0.42</span> U
    </div>

    <div class="control-panel" id="wavePanel">
        <div class="slider-label">
            <span><i class="fas fa-fire"></i> Intensitas Termal (Emisi GRK)</span>
            <span id="emisWaveVal" style="background:#00000088; padding:2px 12px; border-radius: 50px;">0.80</span>
        </div>
        <input type="range" id="thermalSlider" min="0.5" max="2.2" step="0.01" value="0.8">
        
        <div class="stats-wave">
            <div class="stat-wave-card"><div class="label"><i class="fas fa-wave-sine"></i> Amplitudo Fonon</div><span id="phononAmp" class="stat-num">0.28</span></div>
            <div class="stat-wave-card"><div class="label"><i class="fas fa-random"></i> Entropi (S)</div><span id="entropyWaveVal" class="stat-num">312</span> J/K</div>
            <div class="stat-wave-card"><div class="label"><i class="fas fa-exchange-alt"></i> Q_in / Q_out</div><span id="fluxWaveVal" class="stat-num">0.85/0.82</span></div>
        </div>
        <button id="resetWaveBtn" class="reset-wave"><i class="fas fa-undo-alt"></i> Reset Keadaan Gelombang Awal</button>
        <div class="law-hint">
            <i class="fas fa-chalkboard"></i> Hk 0: Kesetimbangan termal | Hk I: ΔU = Q - W | Hk II: Entropi &rarr; gelombang energi irreversibel
        </div>
    </div>
    <div class="toggle-btn" id="toggleWavePanel">
        <i class="fas fa-bars-progress"></i> <span id="toggleWaveText">Sembunyikan Panel</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // ---------------- Setup Scene ------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020220);
        scene.fog = new THREE.FogExp2(0x020220, 0.004);
        
        const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(2.5, 1.4, 4.2);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.target.set(0, 0, 0);
        
        // ---------- representasi atom dan gelombang kisi ----------
        // Nukleus pusat (atom sentral)
        const nucleusMat = new THREE.MeshStandardMaterial({ color: 0xff7766, emissive: 0xff4411, emissiveIntensity: 0.5, metalness: 0.2 });
        const coreAtom = new THREE.Mesh(new THREE.SphereGeometry(0.32, 80, 80), nucleusMat);
        scene.add(coreAtom);
        const coreGlow = new THREE.Mesh(new THREE.SphereGeometry(0.38, 48, 48), new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.2, side: THREE.BackSide }));
        scene.add(coreGlow);
        
        // Elektron valensi berombak (orbit dengan efek wave)
        const electronsWave = [];
        const orbitsLines = [];
        const radii = [0.85, 1.1, 1.35];
        const eMat = new THREE.MeshStandardMaterial({ color: 0xffcc77, emissive: 0xffaa33, emissiveIntensity: 0.5 });
        for (let i = 0; i < 3; i++) {
            const curve = new THREE.EllipseCurve(0, 0, radii[i], radii[i], 0, 2 * Math.PI);
            const pts = curve.getPoints(80);
            const lineGeo = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p.x, p.y, 0)));
            const orbit = new THREE.LineLoop(lineGeo, new THREE.LineBasicMaterial({ color: 0x88bbff, transparent: true, opacity: 0.3 }));
            scene.add(orbit);
            orbitsLines.push(orbit);
            const electronMesh = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 24), eMat);
            scene.add(electronMesh);
            electronsWave.push({ mesh: electronMesh, radius: radii[i], angle: (i * Math.PI * 2 / 3), speed: 1.0 - i * 0.15 });
        }
        
        // KISI KRISTAL 3D dengan efek gelombang berjalan (posisi atom bergerak sinusoidal)
        const latticeWaveGroup = new THREE.Group();
        const atomPositions = [];
        const basePositions = [];
        const gridSize = 2;
        const step = 0.65;
        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    if (Math.abs(x) + Math.abs(y) + Math.abs(z) <= 2.2) {
                        const px = x * step;
                        const py = y * step;
                        const pz = z * step;
                        basePositions.push(new THREE.Vector3(px, py, pz));
                        const atomMesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 24), new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x2288aa, emissiveIntensity: 0.2 }));
                        atomMesh.position.set(px, py, pz);
                        latticeWaveGroup.add(atomMesh);
                        atomPositions.push(atomMesh);
                    }
                }
            }
        }
        // Tambahkan batang kisi (edge visual)
        const edgeConnections = [
            [-step,-step,-step], [ step,-step,-step], [ step, step,-step], [-step, step,-step],
            [-step,-step, step], [ step,-step, step], [ step, step, step], [-step, step, step]
        ];
        for (let i = 0; i < edgeConnections.length; i++) {
            for (let j = i+1; j < edgeConnections.length; j++) {
                const p1 = edgeConnections[i], p2 = edgeConnections[j];
                const dist = Math.hypot(p1[0]-p2[0], p1[1]-p2[1], p1[2]-p2[2]);
                if (dist < 1.3) {
                    const points = [new THREE.Vector3(p1[0], p1[1], p1[2]), new THREE.Vector3(p2[0], p2[1], p2[2])];
                    const geom = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(geom, new THREE.LineBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.2 }));
                    latticeWaveGroup.add(line);
                }
            }
        }
        scene.add(latticeWaveGroup);
        
        // Gelombang Fonon: partikel dinamis yang merambat seperti wave packet
        const phononWaveCount = 650;
        const phononWaveGeo = new THREE.BufferGeometry();
        const phononWavePos = [];
        for (let i = 0; i < phononWaveCount; i++) {
            phononWavePos.push((Math.random() - 0.5) * 4.5, (Math.random() - 0.5) * 3.5, (Math.random() - 0.5) * 4);
        }
        phononWaveGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(phononWavePos), 3));
        const phononWaveMat = new THREE.PointsMaterial({ color: 0x88ddff, size: 0.022, transparent: true, blending: THREE.AdditiveBlending });
        const phononWavePoints = new THREE.Points(phononWaveGeo, phononWaveMat);
        scene.add(phononWavePoints);
        
        // Gelombang energi (riak) - effect ring
        const ringWaveMat = new THREE.MeshBasicMaterial({ color: 0xffaa66, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
        const waveRings = [];
        for (let i = 0; i < 5; i++) {
            const ring = new THREE.Mesh(new THREE.RingGeometry(0.4, 0.9, 32), ringWaveMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = -0.8 + i * 0.4;
            ring.scale.set(1,1,0.8);
            scene.add(ring);
            waveRings.push(ring);
        }
        
        // Partikel energi termal
        const thermalWaveParticles = new THREE.BufferGeometry();
        const thermalPartPos = [];
        for (let i = 0; i < 1000; i++) thermalPartPos.push((Math.random() - 0.5) * 7, (Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5);
        thermalWaveParticles.setAttribute('position', new THREE.BufferAttribute(new Float32Array(thermalPartPos), 3));
        const thermalPartMat = new THREE.PointsMaterial({ color: 0xff8844, size: 0.01, transparent: true, blending: THREE.AdditiveBlending });
        const thermalPoints = new THREE.Points(thermalWaveParticles, thermalPartMat);
        scene.add(thermalPoints);
        
        // ---------- LIGHT ----------
        const ambient = new THREE.AmbientLight(0x222244); scene.add(ambient);
        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.0); mainLight.position.set(3, 4, 2); scene.add(mainLight);
        const backFill = new THREE.PointLight(0xff8855, 0.5); backFill.position.set(-1, 1, 2); scene.add(backFill);
        
        // ----- TERMODINAMIKA BERBASIS GELOMBANG -----
        let currentIntensity = 0.8;    // emisi
        let internalEnergyWave = 0.42;
        let qInWave = 0.85, qOutWave = 0.82;
        let entropyWave = 312.0;
        let waveAnomaly = 0.0;
        
        function updateThermoWave(emiss) {
            const forcing = Math.max(0, (emiss - 0.7) / 1.5);
            qInWave = Math.min(1.65, 0.82 + forcing * 0.78);
            qOutWave = Math.min(1.4, 0.78 + forcing * 0.6);
            const deltaU = (qInWave - qOutWave) * 0.012;
            internalEnergyWave = Math.min(0.86, Math.max(0.38, internalEnergyWave + deltaU));
            let anomalyVal = forcing * 3.7;
            if (emiss > 0.94 && emiss < 1.06) anomalyVal = 1.2 + (emiss - 1.0) * 2.4;
            anomalyVal = Math.max(-0.1, Math.min(4.4, anomalyVal));
            entropyWave = Math.min(445, Math.max(300, 312 + anomalyVal * 13.2));
            return anomalyVal;
        }
        
        // variable animasi gelombang
        let waveTime = 0;
        let lastAnomalyCache = 0;
        
        // UI elemen
        const sliderWave = document.getElementById('thermalSlider');
        const emisSpan = document.getElementById('emisWaveVal');
        const phononAmpSpan = document.getElementById('phononAmp');
        const entropySpanWave = document.getElementById('entropyWaveVal');
        const fluxSpanWave = document.getElementById('fluxWaveVal');
        const anomalySpanWave = document.getElementById('waveAnomaly');
        const energySpanWave = document.getElementById('energyWave');
        const resetWaveBtn = document.getElementById('resetWaveBtn');
        const waveModeSpan = document.getElementById('waveModeLabel');
        
        function refreshWaveUI() {
            emisSpan.innerText = currentIntensity.toFixed(2);
            entropySpanWave.innerText = Math.floor(entropyWave);
            fluxSpanWave.innerText = qInWave.toFixed(2) + "/" + qOutWave.toFixed(2);
            anomalySpanWave.innerHTML = (waveAnomaly >= 0 ? '+' : '') + waveAnomaly.toFixed(1);
            energySpanWave.innerText = internalEnergyWave.toFixed(2);
            const ampFonon = 0.2 + Math.min(0.9, waveAnomaly / 3.2);
            phononAmpSpan.innerText = ampFonon.toFixed(2);
            if (waveAnomaly > 1.9) anomalySpanWave.style.color = '#ff6666';
            else if (waveAnomaly > 0.9) anomalySpanWave.style.color = '#ffaa77';
            else anomalySpanWave.style.color = '#88ddff';
            
            if (currentIntensity < 0.85) waveModeSpan.innerHTML = "🌊 Gelombang Stasioner | Ekuilibrium";
            else if (currentIntensity < 1.2) waveModeSpan.innerHTML = "📈 Gelombang Berjalan | Hk I Aktif";
            else if (currentIntensity < 1.7) waveModeSpan.innerHTML = "⚡ Gelombang Kejut Termal | Entropi Meningkat";
            else waveModeSpan.innerHTML = "🔥 Turbulensi Fonon | Hk. II Dominan";
        }
        
        sliderWave.addEventListener('input', (e) => {
            currentIntensity = parseFloat(e.target.value);
            waveAnomaly = updateThermoWave(currentIntensity);
            lastAnomalyCache = waveAnomaly;
            refreshWaveUI();
            updateWaveVisuals(waveAnomaly, internalEnergyWave);
        });
        
        resetWaveBtn.addEventListener('click', () => {
            currentIntensity = 0.80;
            sliderWave.value = '0.80';
            waveAnomaly = updateThermoWave(0.80);
            lastAnomalyCache = waveAnomaly;
            refreshWaveUI();
            updateWaveVisuals(waveAnomaly, internalEnergyWave);
        });
        
        function updateWaveVisuals(anomaly, energyVal) {
            const intens = Math.min(1.0, anomaly / 3.2);
            // nukleus & atom pusat
            nucleusMat.emissiveIntensity = 0.45 + intens * 0.7;
            nucleusMat.color.setHex(0xff6644);
            coreGlow.material.opacity = 0.2 + intens * 0.35;
            // elektron berenergi
            eMat.emissiveIntensity = 0.5 + intens * 1.0;
            // kisi atom - warna panas
            atomPositions.forEach(atom => {
                atom.material.emissiveIntensity = 0.2 + intens * 0.8;
                const rColor = 0.5 + intens * 0.5;
                atom.material.color.setRGB(rColor, 0.5 + intens*0.3, 1.0 - intens*0.6);
            });
            // fonon points warna
            phononWaveMat.color.setHSL(0.55, 1.0, 0.5 + intens * 0.4);
            phononWaveMat.size = 0.018 + intens * 0.022;
            thermalPartMat.color.setHex(0xffaa55);
            thermalPartMat.opacity = 0.35 + intens * 0.5;
            
            // kecepatan orbit elektron
            electronsWave.forEach((e, idx) => {
                e.speed = 1.0 - idx * 0.12 + intens * 1.4;
            });
        }
        
        // Animasi gelombang pada posisi atom (kisi bergetar dengan mode gelombang)
        function animateLatticeWave(factor, time) {
            const waveAmp = 0.028 + factor * 0.065;
            const freq = 2.2;
            atomPositions.forEach((atom, idx) => {
                const orig = basePositions[idx];
                if (!orig) return;
                const dx = Math.sin(time * freq + orig.x * 2.5) * Math.cos(time * 1.2 + orig.z * 1.8);
                const dy = Math.sin(time * 1.7 + orig.y * 2.0) * 0.6;
                const dz = Math.cos(time * 1.4 + orig.z * 2.2) * Math.sin(time * 1.1);
                atom.position.x = orig.x + dx * waveAmp;
                atom.position.y = orig.y + dy * waveAmp;
                atom.position.z = orig.z + dz * waveAmp;
            });
        }
        
        // gelombang berjalan pada partikel fonon + efek swirl
        let phononTime = 0;
        function animatePhononWavePacket(intensityFactor, time) {
            phononTime += 0.018;
            const positionsAttr = phononWavePoints.geometry.attributes.position.array;
            const swirl = intensityFactor * 0.6;
            for (let i = 0; i < phononWaveCount; i++) {
                const ix = i * 3, iy = i*3+1, iz = i*3+2;
                // pergerakan gelombang spiral
                const angle = time * 1.9 + positionsAttr[ix] * 1.2;
                const radialMove = Math.sin(angle) * 0.004 * intensityFactor;
                positionsAttr[ix] += (Math.sin(time * 2.3 + positionsAttr[iz]) * 0.002 + radialMove) * (0.6 + intensityFactor);
                positionsAttr[iy] += (Math.cos(time * 1.7 + positionsAttr[ix]) * 0.002) * (0.7 + intensityFactor);
                positionsAttr[iz] += (Math.sin(time * 2.1 + positionsAttr[iy]) * 0.002) * (0.6 + intensityFactor);
                // batas
                if (Math.abs(positionsAttr[ix]) > 3.2) positionsAttr[ix] *= 0.98;
                if (Math.abs(positionsAttr[iy]) > 2.6) positionsAttr[iy] *= 0.98;
                if (Math.abs(positionsAttr[iz]) > 3) positionsAttr[iz] *= 0.98;
            }
            phononWavePoints.geometry.attributes.position.needsUpdate = true;
        }
        
        // animasi ring gelombang energi
        function animateRings(time, intens) {
            waveRings.forEach((ring, idx) => {
                const scaleVal = 1 + Math.sin(time * 3.5 + idx) * 0.2 * (1 + intens);
                ring.scale.set(scaleVal, scaleVal, 1);
                ring.material.opacity = 0.3 + Math.sin(time * 5 + idx) * 0.15 + intens * 0.25;
            });
        }
        
        // partikel termal bergerak cepat
        function animateThermalParticlesWave(intens) {
            const posAtt = thermalPoints.geometry.attributes.position.array;
            for (let i = 0; i < 1000; i++) {
                posAtt[i*3] += (Math.random() - 0.5) * 0.012 * (0.8 + intens);
                posAtt[i*3+1] += (Math.random() - 0.5) * 0.012 * (0.8 + intens);
                posAtt[i*3+2] += (Math.random() - 0.5) * 0.012 * (0.8 + intens);
                if (Math.abs(posAtt[i*3]) > 4.5) posAtt[i*3] *= 0.97;
                if (Math.abs(posAtt[i*3+1]) > 3.5) posAtt[i*3+1] *= 0.97;
                if (Math.abs(posAtt[i*3+2]) > 4) posAtt[i*3+2] *= 0.97;
            }
            thermalPoints.geometry.attributes.position.needsUpdate = true;
        }
        
        // animasi elektron wave
        function animateElectronsWave(stepTime, speedFactor) {
            electronsWave.forEach((e, idx) => {
                e.angle += 0.022 * e.speed * (0.8 + speedFactor * 0.8);
                const x = Math.cos(e.angle) * e.radius;
                const z = Math.sin(e.angle) * e.radius;
                e.mesh.position.set(x, Math.sin(stepTime * 3 + idx) * 0.045, z);
            });
        }
        
        // validasi awal
        updateThermoWave(0.8);
        lastAnomalyCache = 0;
        refreshWaveUI();
        updateWaveVisuals(0, 0.42);
        
        // Main loop animasi gelombang
        let globalTime = 0;
        function animateWave() {
            globalTime += 0.016;
            // sinkronisasi dengan termo slider
            const newAnomaly = updateThermoWave(currentIntensity);
            if (Math.abs(newAnomaly - lastAnomalyCache) > 0.01) {
                lastAnomalyCache = newAnomaly;
                waveAnomaly = newAnomaly;
                refreshWaveUI();
                updateWaveVisuals(waveAnomaly, internalEnergyWave);
            } else {
                waveAnomaly = newAnomaly;
            }
            const intensFactor = Math.min(1.2, waveAnomaly / 3.0);
            
            // update efek gelombang pada kisi
            animateLatticeWave(intensFactor, globalTime);
            animatePhononWavePacket(intensFactor, globalTime);
            animateRings(globalTime, intensFactor);
            animateThermalParticlesWave(intensFactor);
            animateElectronsWave(globalTime, intensFactor);
            
            // rotasi latar & efek
            coreAtom.rotation.y += 0.005;
            latticeWaveGroup.rotation.y += 0.001;
            latticeWaveGroup.rotation.x = Math.sin(globalTime * 0.3) * 0.03;
            phononWavePoints.rotation.y += 0.002;
            
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animateWave);
        }
        
        animateWave();
        
        // UI toggle panel
        const panelWave = document.getElementById('wavePanel');
        const toggleWaveBtn = document.getElementById('toggleWavePanel');
        const toggleWaveTextSpan = document.getElementById('toggleWaveText');
        let panelHidden = false;
        toggleWaveBtn.addEventListener('click', () => {
            panelHidden = !panelHidden;
            if (panelHidden) {
                panelWave.classList.add('hide-panel');
                toggleWaveTextSpan.innerText = 'Tampilkan Panel';
            } else {
                panelWave.classList.remove('hide-panel');
                toggleWaveTextSpan.innerText = 'Sembunyikan Panel';
            }
        });
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // set default visibilities all good
    </script>
</body>
</html>
